<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClarityFlow - AI Client Onboarding & Proposal Generator</title>
    <style>
        body { background-color: #020617; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .container { max-width: 700px; width: 100%; margin: 20px; background: #0f172a; border: 1px solid #1e293b; border-radius: 16px; padding: 32px; box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.5); }
        h1 { color: #34d399; font-size: 24px; margin-top: 0; display: flex; justify-content: space-between; align-items: center; }
        .badge { background: #064e3b; color: #6ee7b7; font-size: 12px; padding: 4px 12px; border-radius: 9999px; border: 1px solid #047857; }
        h2 { font-size: 28px; margin-bottom: 8px; }
        p.subtitle { color: #94a3b8; margin-bottom: 24px; }
        label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 8px; color: #cbd5e1; }
        input { width: 100%; background: #020617; border: 1px solid #334155; border-radius: 12px; padding: 12px 16px; color: #f8fafc; font-size: 16px; box-sizing: border-box; margin-bottom: 16px; outline: none; }
        input:focus { border-color: #34d399; }
        button { width: 100%; background: #059669; color: white; border: none; font-weight: 600; padding: 14px; border-radius: 12px; font-size: 16px; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #10b981; }
        #resultBox { margin-top: 24px; border-top: 1px solid #1e293b; padding-top: 24px; display: none; }
        #outputContent { background: #020617; padding: 16px; border-radius: 12px; border: 1px solid #1e293b; color: #cbd5e1; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="container">
        <h1>ClarityFlow <span class="badge">100% Free & Live</span></h1>
        
        <h2>Turn Messy Client Chats Into Professional Proposals in Seconds.</h2>
        <p class="subtitle">Generate automated scopes of work, timelines, and accurate pricing estimates without lifting a finger.</p>
        
        <div>
            <label>Project Name / Description</label>
            <input type="text" id="projectInput" placeholder="e.g., E-commerce website redesign for handmade ceramics">
            <button onclick="generateScope()">Generate AI Scope & Estimate</button>
        </div>

        <div id="resultBox">
            <h3 style="color: #34d399; margin-top: 0;">Generated Scope of Work</h3>
            <div id="outputContent"></div>
        </div>
    </div>

    <script>
        function generateScope() {
            const val = document.getElementById('projectInput').value;
            if(!val) return alert('Please enter a project description!');
            
            const resultBox = document.getElementById('resultBox');
            const output = document.getElementById('outputContent');
            resultBox.style.display = 'block';
            
            output.innerHTML = `
                <p><strong>Project:</strong> ${val}</p>
                <p><strong>Timeline:</strong> 4 Weeks Standard Delivery</p>
                <p><strong>Estimated Pricing:</strong> $4,500 - $7,500</p>
                <p style="color: #34d399; margin-bottom: 0;">✓ Scope, milestones, and deliverables structured successfully.</p>
            `;
        }
    </script>
</body>
</html>
